# Checks on Windows, macOS and Linux on every push and pull request.
#  - "engine": npm test with Node 22.13 (the minimum: the first with node:sqlite without a flag) and 24
#    (nothing to install)
#  - "window": installs Electron like a user would, runs scripts/platform-test.js (shortcuts, autostart,
#    osint, Cowork folders, in a temporary home), opens the app with the demo, takes a screenshot and
#    saves it among the run's artifacts; on macOS it also checks the mini mode and screenshots the reality map
# The two groups run independently, so a runner stuck in the queue on one system
# doesn't hold back the others. macOS uses Intel runners: the arm64 ones
# (macos-latest) often never get a machine because of GitHub's capacity limits.
# Actions are pinned to full commit hashes (a tag can be moved), with the version next to them.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# the jobs only read the code: the token can't push, open releases or change settings
permissions:
  contents: read

jobs:
  engine:
    name: Engine · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        node: ['22.13.0', 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # the tests refuse to start unless the data folder is a temporary one (scripts/test-guard.js)
      - run: node scripts/smoke-test.js
        env:
          PLATYPUS_DATA_DIR: ${{ runner.temp }}/platypus-data

  window:
    name: Window · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies like the launcher does
        run: node scripts/launch.js --setup
      - name: System checks in a temporary home (shortcuts, autostart, osint, Cowork folders)
        env:
          CI: 'true'
        run: node scripts/platform-test.js
      - name: Graphics libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libxss1 libnotify4 libasound2t64
      - name: Open the window with the demo and take a screenshot
        shell: bash
        env:
          PLATYPUS_SNAPSHOT: ${{ github.workspace }}/snapshot-${{ runner.os }}.png
          PLATYPUS_SNAPSHOT_DELAY: '12000'
          PLATYPUS_PORT: '47811'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            timeout 120 xvfb-run -a npx electron . --demo --no-sandbox
          else
            npx electron . --demo
          fi
          test -s "$PLATYPUS_SNAPSHOT"
      - name: Mini mode (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PLATYPUS_SNAPSHOT: ${{ github.workspace }}/snapshot-mini-${{ runner.os }}.png
          PLATYPUS_SNAPSHOT_DELAY: '10000'
          PLATYPUS_SNAPSHOT_JS: "document.getElementById('btn-mini').click()"
          PLATYPUS_DEBUG: '1'
          PLATYPUS_PORT: '47811'
        run: |
          npx electron . --demo | tee mini.log
          test -s "$PLATYPUS_SNAPSHOT"
          # the strip must be small and always on top (src/main.js prints the bounds just before the screenshot)
          node scripts/check-mini-log.js mini.log
      - name: Reality map screenshot (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PLATYPUS_SNAPSHOT: ${{ github.workspace }}/snapshot-map-${{ runner.os }}.png
          PLATYPUS_SNAPSHOT_DELAY: '12000'
          PLATYPUS_SNAPSHOT_JS: "(async()=>{const s=(await (await fetch('/api/state')).json()).sessions[0]; window.openWorldMap(s.id,'main');})()"
          PLATYPUS_PORT: '47811'
        run: |
          npx electron . --demo
          test -s "$PLATYPUS_SNAPSHOT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snapshot-${{ runner.os }}
          path: snapshot-*.png
          if-no-files-found: warn
