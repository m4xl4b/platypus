[package]
name = "platypus-tauri"
version = "0.1.0"
description = "Experimental Tauri 2 shell for Platypus"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[[bin]]
name = "platypus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
